name: Rust CI

on:
  push:
    branches: "*"
  pull_request:
    branches: "*"

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリの取得
        uses: actions/checkout@v4

      - name: Rustツールチェーンのセットアップ
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - name: Cargoキャッシュの有効化
        uses: Swatinem/rust-cache@v2

      - name: コンパイルチェック (cargo check)
        run: cargo check --verbose

      - name: テストの実行 (cargo test)
        run: cargo test --verbose
