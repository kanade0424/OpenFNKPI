<!DOCTYPE html>
<html lang="ja">
    <head>
        <title>ログイン - OpenFNKPI</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="OpenFNKPI ダッシュボードへのログインページ">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="./login.css">
    </head>
    <body>
        <div class="bg-bubbles" aria-hidden="true">
            <div class="bubble"></div>
            <div class="bubble"></div>
            <div class="bubble"></div>
            <div class="bubble"></div>
            <div class="bubble"></div>
            <div class="bubble"></div>
        </div>

        <main class="login-wrapper" role="main">
            <div class="login-card" id="loginCard">
                <div class="card-header">
                    <h1 class="card-title">ログイン</h1>
                    <p class="card-subtitle">OpenFNKPI ダッシュボード</p>
                </div>

                <form class="login-form" id="loginForm" novalidate>
                    <div class="form-group" id="group-userId">
                        <label class="form-label" for="userId">ユーザーID</label>
                        <div class="input-wrapper">
                            <span class="input-icon" aria-hidden="true">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                                    <path d="M10 9a3 3 0 100-6 3 3 0 000 6zM6 8a4 4 0 118 0A4 4 0 016 8z"/>
                                    <path d="M1.5 17.5a8.5 8.5 0 0117 0H1.5z"/>
                                </svg>
                            </span>
                            <input
                                type="text"
                                id="userId"
                                name="userId"
                                class="form-input"
                                placeholder="ユーザーIDを入力"
                                autocomplete="username"
                                required
                            >
                        </div>
                        <span class="error-msg" id="error-userId" role="alert" aria-live="polite"></span>
                    </div>

                    <div class="form-group" id="group-password">
                        <label class="form-label" for="password">パスワード</label>
                        <div class="input-wrapper">
                            <span class="input-icon" aria-hidden="true">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                                    <path fill-rule="evenodd" d="M10 1a4.5 4.5 0 00-4.5 4.5V9H5a2 2 0 00-2 2v6a2 2 0 002 2h10a2 2 0 002-2v-6a2 2 0 00-2-2h-.5V5.5A4.5 4.5 0 0010 1zm3 8V5.5a3 3 0 10-6 0V9h6z" clip-rule="evenodd"/>
                                </svg>
                            </span>
                            <input
                                type="password"
                                id="password"
                                name="password"
                                class="form-input"
                                placeholder="パスワードを入力"
                                autocomplete="current-password"
                                required
                            >
                            <button type="button" class="toggle-password" id="togglePassword" aria-label="パスワードを表示">
                                <svg class="eye-icon eye-open" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                                    <path d="M10 12a2 2 0 100-4 2 2 0 000 4z"/>
                                    <path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd"/>
                                </svg>
                                <svg class="eye-icon eye-closed" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" style="display:none">
                                    <path fill-rule="evenodd" d="M3.28 2.22a.75.75 0 00-1.06 1.06l14.5 14.5a.75.75 0 101.06-1.06l-1.745-1.745a10.029 10.029 0 003.3-4.38 1.651 1.651 0 000-1.185A10.004 10.004 0 009.999 3a9.956 9.956 0 00-4.744 1.194L3.28 2.22zM7.752 6.69l1.092 1.092a2.5 2.5 0 013.374 3.373l1.091 1.092a4 4 0 00-5.557-5.557z" clip-rule="evenodd"/>
                                    <path d="M10.748 13.93l2.523 2.524a9.987 9.987 0 01-3.27.547c-4.258 0-7.894-2.66-9.337-6.41a1.651 1.651 0 010-1.186A10.007 10.007 0 012.839 6.02L6.07 9.252a4 4 0 004.678 4.678z"/>
                                </svg>
                            </button>
                        </div>
                        <span class="error-msg" id="error-password" role="alert" aria-live="polite"></span>
                    </div>

                    <div class="form-error" id="formError" role="alert" aria-live="assertive" style="display:none">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                            <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-8-5a.75.75 0 01.75.75v4.5a.75.75 0 01-1.5 0v-4.5A.75.75 0 0110 5zm0 10a1 1 0 100-2 1 1 0 000 2z" clip-rule="evenodd"/>
                        </svg>
                        <span id="formErrorText"></span>
                    </div>

                    <button type="submit" class="btn-login" id="btnLogin">
                        <span class="btn-text">ログイン</span>
                        <span class="btn-spinner" aria-hidden="true" style="display:none"></span>
                    </button>
                </form>
            </div>
        </main>

        <script type="module" src="./login.js"></script>
    </body>
</html>
